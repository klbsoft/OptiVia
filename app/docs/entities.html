<script>
  // ─── User ───────────────────────────────────
class User {
  constructor({ id, name, email, phone, password_hash, created_at }) {
    this.id = id
    this.name = name
    this.email = email
    this.phone = phone
    this.password_hash = password_hash
    this.created_at = created_at
  }
}

// ─── Card ───────────────────────────────────
class Card {
  constructor({ id, user_id, name_on_card, card_number, expiry_date, cvv, card_type, is_default, created_at }) {
    this.id = id
    this.user_id = user_id               // FK → User
    this.name_on_card = name_on_card
    this.card_number = card_number
    this.expiry_date = expiry_date
    this.cvv = cvv
    this.card_type = card_type
    this.is_default = is_default
    this.created_at = created_at
  }
}

// ─── Transaction ────────────────────────────
class Transaction {
  constructor({ id, user_id, payment_method, amount, type, status, bus_id, route_id, created_at }) {
    this.id = id
    this.user_id = user_id               // FK → User
    this.payment_method = payment_method
    this.amount = amount
    this.type = type
    this.status = status
    this.bus_id = bus_id                 // FK → Bus
    this.route_id = route_id             // FK → Route
    this.created_at = created_at
  }
}

// ─── Driver ─────────────────────────────────
class Driver {
  constructor({ id, name, email, phone, license_number, status, created_at }) {
    this.id = id
    this.name = name
    this.email = email
    this.phone = phone
    this.license_number = license_number
    this.status = status
    this.created_at = created_at
  }
}

// ─── Bus ────────────────────────────────────
class Bus {
  constructor({ id, plate_number, model, capacity, current_latitude, current_longitude, speed, status, last_updated }) {
    this.id = id
    this.plate_number = plate_number
    this.model = model
    this.capacity = capacity
    this.current_latitude = current_latitude
    this.current_longitude = current_longitude
    this.speed = speed
    this.status = status
    this.last_updated = last_updated
  }
}

// ─── Route ──────────────────────────────────
class Route {
  constructor({ id, name, start_point, end_point, distance_km, estimated_duration_minutes }) {
    this.id = id
    this.name = name
    this.start_point = start_point
    this.end_point = end_point
    this.distance_km = distance_km
    this.estimated_duration_minutes = estimated_duration_minutes
  }
}

// ─── RouteStop ──────────────────────────────
class RouteStop {
  constructor({ id, route_id, stop_name, latitude, longitude, stop_order }) {
    this.id = id
    this.route_id = route_id             // FK → Route
    this.stop_name = stop_name
    this.latitude = latitude
    this.longitude = longitude
    this.stop_order = stop_order
  }
}

// ─── DriverAssignment ───────────────────────
class DriverAssignment {
  constructor({ id, driver_id, bus_id, route_id, assigned_date, shift_start, shift_end, status }) {
    this.id = id
    this.driver_id = driver_id           // FK → Driver
    this.bus_id = bus_id                 // FK → Bus
    this.route_id = route_id             // FK → Route
    this.assigned_date = assigned_date
    this.shift_start = shift_start
    this.shift_end = shift_end
    this.status = status
  }
}

// ─── Trip ───────────────────────────────────
class Trip {
  constructor({ id, bus_id, route_id, driver_id, start_time, end_time, status, current_stop_order }) {
    this.id = id
    this.bus_id = bus_id                 // FK → Bus
    this.route_id = route_id             // FK → Route
    this.driver_id = driver_id           // FK → Driver
    this.start_time = start_time
    this.end_time = end_time
    this.status = status
    this.current_stop_order = current_stop_order
  }
}

// ─── PassengerTrip ──────────────────────────
class PassengerTrip {
  constructor({ id, user_id, trip_id, transaction_id, boarded_at, exited_at, status }) {
    this.id = id
    this.user_id = user_id               // FK → User
    this.trip_id = trip_id               // FK → Trip
    this.transaction_id = transaction_id // FK → Transaction
    this.boarded_at = boarded_at
    this.exited_at = exited_at
    this.status = status
  }
}

// ─── FearReport ─────────────────────────────
class FearReport {
  constructor({ id, user_id, bus_id, trip_id, description, latitude, longitude, created_at }) {
    this.id = id
    this.user_id = user_id               // FK → User
    this.bus_id = bus_id                 // FK → Bus
    this.trip_id = trip_id               // FK → Trip
    this.description = description
    this.latitude = latitude
    this.longitude = longitude
    this.created_at = created_at
  }
}
</script>
